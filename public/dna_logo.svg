<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Minimalist Lab-style DNA Helix Icon -->
  <path d="M30,20 Q50,50 30,80" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M70,20 Q50,50 70,80" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Connecting base pairs -->
  <line x1="33" y1="30" x2="67" y2="30" stroke="#1A1A1A" stroke-width="2" opacity="0.5"/>
  <line x1="40" y1="40" x2="60" y2="40" stroke="#1A1A1A" stroke-width="2" opacity="0.5"/>
  <circle cx="50" cy="50" r="3" fill="#1A1A1A"/>
  <line x1="40" y1="60" x2="60" y2="60" stroke="#1A1A1A" stroke-width="2" opacity="0.5"/>
  <line x1="33" y1="70" x2="67" y2="70" stroke="#1A1A1A" stroke-width="2" opacity="0.5"/>

  <!-- Nucleotide terminals -->
  <circle cx="30" cy="20" r="4" fill="#1A1A1A"/>
  <circle cx="70" cy="20" r="4" fill="#1A1A1A" opacity="0.3"/>
  <circle cx="30" cy="80" r="4" fill="#1A1A1A"/>
  <circle cx="70" cy="80" r="4" fill="#1A1A1A" opacity="0.3"/>
</svg>
